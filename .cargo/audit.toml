# Cargo audit configuration
# This file documents accepted security warnings and their justifications

[advisories]
# Ignore unmaintained warnings for syntect's dependencies
# These are used only for loading bundled syntax/theme data at compile time,
# not for processing user data at runtime. Syntect itself is actively maintained
# and at the latest version. We accept this risk until syntect updates these deps.

ignore = [
    # bincode is unmaintained but used by syntect only for loading bundled themes
    # See: https://rustsec.org/advisories/RUSTSEC-2025-0141
    "RUSTSEC-2025-0141",

    # yaml-rust is unmaintained but used by syntect only for loading syntax definitions
    # See: https://rustsec.org/advisories/RUSTSEC-2024-0320
    "RUSTSEC-2024-0320",
]
