schemaDecisions:
- field: action
  decision: Enum with Connect, Send, Receive, SendAndReceive, Close variants
  rationale: Single component covers the full lifecycle; action selects the operation
  alternativesConsidered: []
- field: message_type
  decision: Enum with Text and Binary variants
  rationale: WebSocket protocol distinguishes text (UTF-8) and binary frames
  alternativesConsidered: []
- field: subprotocols
  decision: Vec<String> for Sec-WebSocket-Protocol negotiation
  rationale: Many APIs (e.g. graphql-ws) require a specific subprotocol
  alternativesConsidered: []
inputSchema:
  rustStruct: WebsocketInput
  typescriptInterface: WebsocketInput
  fields:
  - name: url
    rustType: String
    typescriptType: string
    required: true
    description: WebSocket URL (ws:// or wss://)
  - name: action
    rustType: WebSocketAction
    typescriptType: WebSocketAction
    required: false
    default: send_and_receive
    description: Operation to perform on the connection
  - name: message
    rustType: Option<String>
    typescriptType: string?
    required: false
    description: Message payload to send; required for Send and SendAndReceive actions
  - name: message_type
    rustType: WebSocketMessageType
    typescriptType: WebSocketMessageType
    required: false
    default: text
    description: WebSocket frame type for the outgoing message
  - name: headers
    rustType: HashMap<String, String>
    typescriptType: Record<string, string>
    required: false
    default: '{}'
    description: HTTP upgrade request headers (e.g. Authorization)
  - name: subprotocols
    rustType: Vec<String>
    typescriptType: string[]
    required: false
    default: '[]'
    description: Requested WebSocket subprotocols for the handshake
  - name: receive_timeout_ms
    rustType: Option<u64>
    typescriptType: number?
    required: false
    description: Maximum time to wait for an incoming message in milliseconds
  - name: timeout_ms
    rustType: u64
    typescriptType: number
    required: false
    default: '60000'
    description: Overall operation timeout in milliseconds
  validation: []
outputSchema:
  rustStruct: WebsocketOutput
  typescriptInterface: WebsocketOutput
  fields:
  - name: connected
    rustType: bool
    typescriptType: boolean
    required: true
    description: Whether the connection was established successfully
  - name: message
    rustType: Option<String>
    typescriptType: string?
    required: false
    description: Received message payload if action includes Receive
  - name: message_type
    rustType: Option<WebSocketMessageType>
    typescriptType: WebSocketMessageType?
    required: false
    description: Frame type of the received message
  - name: close_code
    rustType: Option<u16>
    typescriptType: number?
    required: false
    description: WebSocket close code if the connection was closed
  - name: close_reason
    rustType: Option<String>
    typescriptType: string?
    required: false
    description: Human-readable close reason from the peer
  validation: []
