lessonsLearned:
  whatWorkedWell:
  - Action enum keeps a single component ergonomic across the full lifecycle
  - heartbeat_ms aligns with WebSocket ping/pong keepalive semantics
  challenges:
  - challenge: Modeling stateful connection across workflow steps
    solution: Each invocation is self-contained; long-lived connections use the connect action with a workflow signal
    timeSpent: 25 minutes
  recommendations:
  - Pair with signal component for event-driven receive patterns
relatedComponents:
- component: http_request
  relationship: Upgrade path; HTTP connection upgrades to WebSocket
- component: event_emit
  relationship: Received WebSocket messages may be re-emitted as internal events
futureImprovements:
- improvement: Binary message support with base64 encoding
  priority: Medium
  effort: Low
- improvement: Message stream buffering for high-throughput sockets
  priority: Low
  effort: High
