  - name: delay_seconds
    rustType: Option<u32>
    required: false
    description: Number of seconds to delay message delivery
  - name: attributes
    rustType: HashMap<String, String>
    required: false
    description: Provider-specific message attributes
  - name: behaviors
    rustType: BehaviorConfig
    required: false
    description: Runtime behavior overrides (timeout, retry, etc.)
outputSchema:
  rustStruct: QueuePublishOutput
  fields:
  - name: message_id
    rustType: String
