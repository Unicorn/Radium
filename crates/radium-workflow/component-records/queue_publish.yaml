inputSchema:
  rustStruct: QueuePublishInput
  fields:
  - name: queue_url
    rustType: String
    required: true
    description: URL or resource name of the target queue
  - name: provider
    rustType: QueueProvider
    required: false
    description: Cloud queue provider (e.g. SQS, PubSub)
