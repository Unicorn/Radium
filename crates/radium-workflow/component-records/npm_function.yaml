component:
  name: npm_function
  category: execution
  version: 1.0.0
  description: Invoke a function exported by an npm package in an isolated runtime
  temporalType: activity
  behaviorTier: io
migration:
  migratedBy: core-components-wave1
  migrationDate: 2026-02-23T00:00:00Z
  filesCreated:
  - src/schema/components/npm_function.rs
  filesModified:
  - src/schema/components/mod.rs
  - src/yaml_format/types.rs
  - src/yaml_format/transformer.rs
inputSchema:
  rustStruct: NpmFunctionInput
  fields:
  - name: package
    rustType: String
    required: true
    description: The npm package name to load
  - name: function
    rustType: String
    required: true
    description: The exported function name to invoke
  - name: args
    rustType: Vec<Value>
    required: false
    description: Positional arguments to pass to the function
  - name: version
    rustType: Option<String>
    required: false
    description: Specific package version to use (defaults to latest)
  - name: behaviors
    rustType: BehaviorConfig
    required: false
    description: Runtime behavior overrides (timeout, retry, etc.)
outputSchema:
  rustStruct: NpmFunctionOutput
  fields:
  - name: result
    rustType: Value
    required: true
    description: The value returned by the function
  - name: package_version
    rustType: String
    required: true
    description: Resolved version of the package that was executed
defaultBehaviors:
  timeout_ms: 60000
  rate_limit_rps: 5
  rate_limit_burst: 10
  heartbeat_ms: 10000
relatedComponents: []
