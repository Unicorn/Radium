schemaDecisions:
- field: grant_type
  decision: Enum with ClientCredentials, AuthorizationCode, RefreshToken variants
  rationale: Covers the primary OAuth2 grant flows
  alternativesConsidered: []
- field: client_secret_ref
  decision: Option<String> referencing a secret store key
  rationale: Secrets must never be stored inline; ref pattern matches existing conventions
  alternativesConsidered: []
- field: additional_params
  decision: HashMap<String, String> for extensibility
  rationale: Different providers require non-standard parameters
  alternativesConsidered: []
inputSchema:
  rustStruct: OauthTokenInput
  typescriptInterface: OauthTokenInput
  fields:
  - name: token_url
    rustType: String
    typescriptType: string
    required: true
