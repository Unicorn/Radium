testCases:
- name: test_client_credentials_flow
  category: unit
  input: OauthTokenInput::client_credentials("https://auth.example.com/token", "client-id")
  expectedOutput: Valid token request for client_credentials grant
  passed: true
- name: test_authorization_code_flow
  category: unit
  input: OauthTokenInput::authorization_code("https://auth.example.com/token", "client-id", "auth-code")
  expectedOutput: Valid token request for authorization_code grant
  passed: true
- name: test_refresh_token_flow
  category: unit
  input: OauthTokenInput::refresh("https://auth.example.com/token", "client-id", "refresh-ref")
  expectedOutput: Valid token request for refresh_token grant
  passed: true
lessonsLearned:
  whatWorkedWell:
  - Secret reference pattern prevents inline credential storage
  - Grant type enum drives validation logic cleanly
  challenges:
  - challenge: Provider-specific parameter variations
    solution: additional_params HashMap absorbs non-standard fields
    timeSpent: 20 minutes
  recommendations:
  - Always use secret store references; never accept raw secret values
