validationRules:
- rule: code_required_for_authorization_code_grant
  implementation: validate_config()
  errorMessage: code is required when grant_type is authorization_code
  rationale: Authorization code grant requires the authorization code
- rule: refresh_token_required_for_refresh_grant
  implementation: validate_config()
  errorMessage: refresh_token_ref is required when grant_type is refresh_token
  rationale: Refresh token grant requires an existing refresh token
