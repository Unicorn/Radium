inputSchema:
  rustStruct: QueueConsumeInput
  fields:
  - name: queue_url
    rustType: String
    required: true
    description: URL or resource name of the source queue
  - name: provider
    rustType: QueueProvider
    required: false
    description: Cloud queue provider (e.g. SQS, PubSub)
  - name: max_messages
    rustType: u32
    required: false
    description: Maximum number of messages to retrieve (default 1)
  - name: wait_time_seconds
    rustType: Option<u32>
