    description: Long-poll wait duration in seconds
  - name: visibility_timeout
    rustType: Option<u32>
    required: false
    description: Seconds a received message is hidden from other consumers
  - name: auto_acknowledge
    rustType: bool
    required: false
    description: Automatically delete messages after successful receipt (default true)
  - name: behaviors
    rustType: BehaviorConfig
    required: false
    description: Runtime behavior overrides (timeout, retry, etc.)
outputSchema:
  rustStruct: QueueConsumeOutput
  fields:
  - name: messages
    rustType: Vec<QueueMessage>
    required: true
    description: Messages retrieved from the queue
  - name: count
    rustType: u32
    required: true
    description: Number of messages returned
defaultBehaviors:
