testCases:
- name: test_hs256_token
  category: unit
  input: JwtCreateInput::hs256("secret-ref").with_subject("user-123")
  expectedOutput: Valid signed HS256 JWT
  passed: true
- name: test_rs256_token
  category: unit
  input: JwtCreateInput::rs256("key-ref").with_issuer("my-service")
  expectedOutput: Valid signed RS256 JWT
  passed: true
- name: test_expiring_token
  category: unit
  input: JwtCreateInput::hs256("secret-ref").expires_in(3600)
  expectedOutput: Token with exp claim set 3600s from now
  passed: true
lessonsLearned:
  whatWorkedWell:
  - Separating secret_ref and private_key_ref makes algorithm requirements explicit
  - pure behaviorTier means no I/O side-effects; signing is deterministic
  challenges:
  - challenge: Algorithm-to-key-type mapping validation
    solution: validate_config() checks algorithm family against provided ref
    timeSpent: 15 minutes
  recommendations:
  - Keep signing pure; fetch secrets in a preceding activity if needed
relatedComponents:
- component: oauth_token
  relationship: JWTs are often used as bearer tokens in OAuth2 flows
- component: http_request
  relationship: Generated tokens are passed as Authorization headers
