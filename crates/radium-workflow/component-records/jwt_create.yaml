validationRules:
- rule: hmac_requires_secret_ref
  implementation: validate_config()
  errorMessage: secret_ref is required for HMAC algorithms (HS256/HS384/HS512)
  rationale: HMAC signing needs a shared secret
- rule: asymmetric_requires_private_key_ref
  implementation: validate_config()
  errorMessage: private_key_ref is required for RSA and EC algorithms
  rationale: Asymmetric signing needs the private key
