    default: '{}'
    description: Custom payload claims to include in the token
  - name: issuer
    rustType: Option<String>
    typescriptType: string?
    required: false
    description: iss claim value
  - name: subject
    rustType: Option<String>
    typescriptType: string?
    required: false
    description: sub claim value
  - name: audience
    rustType: Option<String>
    typescriptType: string?
    required: false
    description: aud claim value
  - name: expires_in_seconds
    rustType: Option<u64>
    typescriptType: number?
    required: false
    description: Token lifetime in seconds; omit for a non-expiring token
  - name: not_before
    rustType: Option<u64>
    typescriptType: number?
    required: false
    description: nbf offset in seconds from now
  - name: additional_headers
    rustType: HashMap<String, Value>
    typescriptType: Record<string, unknown>
    required: false
    default: '{}'
    description: Additional JOSE header fields
  validation: []
