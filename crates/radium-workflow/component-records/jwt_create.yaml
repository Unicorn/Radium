schemaDecisions:
- field: algorithm
  decision: Enum with HS256, HS384, HS512, RS256, RS384, RS512, ES256, ES384 variants
  rationale: Covers HMAC symmetric and RSA/EC asymmetric signing algorithms
  alternativesConsidered: []
- field: secret_ref / private_key_ref
  decision: Separate optional refs; validation enforces exactly one is present
  rationale: HMAC algorithms use a shared secret; RSA/EC algorithms use a private key
  alternativesConsidered: []
- field: claims
  decision: HashMap<String, Value> for arbitrary claim payloads
  rationale: JWTs carry application-defined claims; a map provides full flexibility
  alternativesConsidered: []
inputSchema:
  rustStruct: JwtCreateInput
  typescriptInterface: JwtCreateInput
  fields:
  - name: algorithm
    rustType: JwtAlgorithm
    typescriptType: JwtAlgorithm
    required: false
    default: HS256
    description: JWT signing algorithm
  - name: secret_ref
    rustType: Option<String>
    typescriptType: string?
    required: false
    description: Secret store reference for HMAC signing secret
  - name: private_key_ref
    rustType: Option<String>
    typescriptType: string?
    required: false
    description: Secret store reference for RSA or EC private key
  - name: claims
    rustType: HashMap<String, Value>
    typescriptType: Record<string, unknown>
