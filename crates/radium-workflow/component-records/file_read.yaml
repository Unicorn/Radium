component:
  name: file_read
  category: io
  version: 1.0.0
  description: Read file contents from the local filesystem with encoding support
  temporalType: activity
  behaviorTier: io
migration:
  migratedBy: core-components-wave2
  migrationDate: 2026-02-23T00:00:00Z
  filesCreated:
  - src/schema/components/file_read.rs
  filesModified:
  - src/schema/components/mod.rs
  - src/yaml_format/types.rs
