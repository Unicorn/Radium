lessonsLearned:
  whatWorkedWell:
  - High rate limit (100 rps) suits fire-and-forget event patterns
  - idempotency_key decouples retry safety from workflow logic
  challenges:
  - challenge: Defining accepted vs delivered semantics
    solution: accepted field reflects bus acknowledgement; delivery is the bus's responsibility
    timeSpent: 10 minutes
  recommendations:
  - Use idempotency_key on any event emitted inside a retryable activity
relatedComponents:
- component: trigger
  relationship: Events emitted here may trigger other workflows via event triggers
