schemaDecisions:
- field: event_type
  decision: String with dot-notation convention (e.g. order.created)
  rationale: Flexible naming allows hierarchical routing without a fixed registry
  alternativesConsidered: []
- field: idempotency_key
  decision: Option<String> for at-least-once deduplication
  rationale: Event buses may deliver duplicates; an idempotency key enables dedup at the consumer
  alternativesConsidered: []
- field: correlation_id
  decision: Option<String> for distributed tracing
  rationale: Links emitted events to originating workflow runs for observability
  alternativesConsidered: []
