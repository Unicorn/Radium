  usageLocations: []
  dependencies: []
schemaDecisions:
- field: fail_strategy
  decision: Enum with FailFast, ContinueOnError, SkipOnError variants
  rationale: Different use cases require different error tolerance; FailFast is safe default
  alternativesConsidered: []
- field: batch_size
  decision: u32 controlling how many items are dispatched per chunk
  rationale: Chunks allow progress checkpointing and memory control for large collections
  alternativesConsidered: []
- field: concurrency
  decision: u32 limiting simultaneous in-flight activity executions
  rationale: Protects downstream systems from being overwhelmed
  alternativesConsidered: []
- field: results
  decision: Vec<BatchItemResult> with per-item status and output
  rationale: Callers need to inspect individual outcomes; aggregates alone are insufficient
  alternativesConsidered: []
inputSchema:
  rustStruct: BatchInput
  typescriptInterface: BatchInput
  fields:
  - name: items
    rustType: Vec<Value>
    typescriptType: unknown[]
    required: true
    description: Collection of items to process; each is passed as input to the activity
  - name: batch_size
    rustType: u32
    typescriptType: number
    required: false
    default: '10'
    description: Number of items dispatched per processing chunk
  - name: concurrency
    rustType: u32
    typescriptType: number
    required: false
    default: '1'
    description: Maximum number of simultaneously executing activity instances
  - name: fail_strategy
    rustType: BatchFailStrategy
    typescriptType: BatchFailStrategy
    required: false
    default: fail_fast
    description: How to handle individual item failures
  - name: activity_name
    rustType: String
    typescriptType: string
    required: true
    description: Name of the registered Temporal activity to invoke per item
  - name: task_queue
    rustType: Option<String>
    typescriptType: string?
    required: false
    description: Temporal task queue override for the child activities
  - name: timeout_ms
    rustType: u64
    typescriptType: number
    required: false
    default: '300000'
    description: Total batch timeout in milliseconds
  validation: []
outputSchema:
  rustStruct: BatchOutput
  typescriptInterface: BatchOutput
  fields:
  - name: results
    rustType: Vec<BatchItemResult>
    typescriptType: BatchItemResult[]
    required: true
    description: Per-item execution result including status, output, and error
  - name: total_items
    rustType: u32
    typescriptType: number
    required: true
    description: Total number of items submitted for processing
  - name: successful
    rustType: u32
    typescriptType: number
    required: true
    description: Number of items that completed successfully
  - name: failed
    rustType: u32
    typescriptType: number
    required: true
    description: Number of items that encountered an error
  - name: skipped
    rustType: u32
    typescriptType: number
    required: true
    description: Number of items skipped due to SkipOnError strategy
  validation: []
validationRules:
- rule: concurrency_positive
  implementation: validate_config()
  errorMessage: concurrency must be at least 1
  rationale: Zero concurrency would deadlock the batch
- rule: batch_size_positive
  implementation: validate_config()
  errorMessage: batch_size must be at least 1
  rationale: Zero batch size is not meaningful
