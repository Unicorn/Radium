defaultBehaviors:
  timeout_ms: 300000
  rate_limit_rps: 10
  rate_limit_burst: 20
  heartbeat_ms: 10000
typescriptTemplate:
  templatePath: ''
  generatedCodeExample: ''
  keyPatterns: []
testCases:
- name: test_basic_batch
  category: unit
  input: BatchInput::new(items, "process_item")
  expectedOutput: Valid batch configuration with default batch_size 10
  passed: true
- name: test_batch_fail_fast
  category: unit
  input: BatchInput::new(items, "process_item").with_fail_strategy(BatchFailStrategy::FailFast)
  expectedOutput: Batch halts on first item failure
  passed: true
- name: test_batch_continue_on_error
  category: unit
  input: BatchInput::new(items, "process_item").with_fail_strategy(BatchFailStrategy::ContinueOnError)
  expectedOutput: Batch processes all items regardless of individual failures
  passed: true
- name: test_concurrent_batch
  category: unit
  input: BatchInput::new(items, "process_item").with_concurrency(5)
  expectedOutput: Valid batch with concurrency 5
  passed: true
lessonsLearned:
  whatWorkedWell:
  - BatchItemResult struct makes per-item introspection straightforward
  - heartbeat_ms is critical for long-running batches to avoid Temporal activity timeouts
  challenges:
  - challenge: Aggregating partial results when FailFast terminates early
    solution: results Vec is populated up to the point of failure; remaining items are absent
    timeSpent: 20 minutes
  recommendations:
  - Set heartbeat_ms to less than the Temporal activity heartbeat timeout
  - Use ContinueOnError with post-batch result inspection for resilient pipelines
relatedComponents:
- component: parallel
  relationship: Parallel component fans out known sub-workflows; batch fans out over a dynamic item collection
- component: loop
  relationship: Loop iterates sequentially; batch iterates with configurable concurrency
- component: activity
  relationship: Each batch item invokes an activity by name
futureImprovements:
- improvement: Dynamic concurrency adjustment based on downstream rate limits
  priority: Medium
  effort: High
- improvement: Progress reporting via workflow signals
  priority: Medium
  effort: Medium
