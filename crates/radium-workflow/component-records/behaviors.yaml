lessonsLearned:
  whatWorkedWell:
  - Tiered approach keeps lightweight components free of behavior overhead
  - Single ComponentBehaviors struct is easy to embed and evolve
  challenges: []
  recommendations:
  - All new I/O components must embed ComponentBehaviors
  - Stateful components may embed timeout only
  - Pure components must not embed behaviors
