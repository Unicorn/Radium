schemaDecisions:
- field: behavior_tiers
  decision: Three tiers — Pure, Stateful, I/O
  rationale: Not all components need all behaviors; tiering avoids unnecessary overhead
  alternativesConsidered:
  - Single flat behaviors struct on every component (too heavy for pure/stateful)
- field: ComponentBehaviors
  decision: Aggregates all optional behavior configs into one embeddable struct
  rationale: Single field on I/O components keeps schema clean
  alternativesConsidered: []
- field: IdempotencyConfig
  decision: Explicit idempotency key and dedup window
  rationale: Required for safe retry and at-least-once delivery guarantees
  alternativesConsidered: []
- field: CircuitBreakerConfig
  decision: Threshold + window + half-open probe controls
  rationale: Prevents cascading failures on downstream I/O
  alternativesConsidered: []
