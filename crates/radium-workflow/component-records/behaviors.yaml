behaviorTiers:
- tier: Pure
  description: No behaviors attached
  examples:
  - conditional
  - loop
  - start
  - stop
  behaviors: []
- tier: Stateful
  description: Timeout only — no external I/O
  examples:
  - timer
  - child_service
  behaviors:
  - timeout
- tier: I/O
  description: Full behavior suite for components that call external systems
  examples:
  - action
  - http_request
  - database_query
  - message
  behaviors:
  - retry
  - rate_limit
  - circuit_breaker
  - idempotency
  - observability
  - payload_limits
