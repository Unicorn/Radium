  - src/yaml_format/transformer.rs
discovery:
  originalTypescriptFile: ''
  linesOfCode: 0
  existingTests: []
  usageLocations: []
  dependencies: []
schemaDecisions:
- field: unit
  decision: Enum with Milliseconds, Seconds, Minutes, Hours variants
  rationale: Human-readable unit keeps workflow definitions self-documenting
  alternativesConsidered: []
- field: duration_ms / value
  decision: Both provided; duration_ms is the canonical resolved value for the runtime
  rationale: value + unit is the authoring form; duration_ms is the execution form
  alternativesConsidered: []
- field: jitter_ms
  decision: Optional random jitter added to the delay
  rationale: Jitter prevents thundering herd in parallel workflow branches
  alternativesConsidered: []
inputSchema:
  rustStruct: DelayInput
  typescriptInterface: DelayInput
  fields:
  - name: duration_ms
    rustType: u64
    typescriptType: number
    required: false
    default: '1000'
    description: Delay duration in milliseconds (canonical execution value)
  - name: unit
    rustType: DelayUnit
    typescriptType: DelayUnit
    required: false
    default: milliseconds
    description: Human-readable time unit for authoring
  - name: value
    rustType: f64
    typescriptType: number
    required: false
    default: '1.0'
    description: Numeric value combined with unit for authoring convenience
  - name: jitter_ms
    rustType: Option<u64>
    typescriptType: number?
    required: false
    description: Maximum random jitter in milliseconds added to the delay
  validation: []
outputSchema:
  rustStruct: DelayOutput
  typescriptInterface: DelayOutput
  fields:
  - name: delayed_ms
    rustType: u64
    typescriptType: number
    required: true
    description: Actual elapsed time in milliseconds including any jitter
  - name: requested_ms
    rustType: u64
    typescriptType: number
    required: true
    description: Originally requested delay in milliseconds before jitter
  validation: []
validationRules:
- rule: duration_ms_positive
  implementation: validate_config()
  errorMessage: duration_ms must be greater than zero
  rationale: A zero-length delay is a no-op and almost certainly a misconfiguration
