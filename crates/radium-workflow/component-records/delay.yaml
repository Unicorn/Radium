component:
  name: delay
  category: control-flow
  version: 1.0.0
  description: Delay component for introducing controlled pauses in workflow execution
  temporalType: activity
  behaviorTier: stateful
migration:
  migratedBy: core-components-wave4
  migrationDate: 2026-02-23T00:00:00Z
  durationHours: 1.0
  difficulty: low
