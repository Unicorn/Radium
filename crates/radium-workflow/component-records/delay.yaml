testCases:
- name: test_milliseconds_delay
  category: unit
  input: DelayInput::milliseconds(500)
  expectedOutput: 500ms delay configuration
  passed: true
- name: test_seconds_delay
  category: unit
  input: DelayInput::seconds(5.0)
  expectedOutput: 5000ms delay configuration
  passed: true
- name: test_delay_with_jitter
  category: unit
  input: DelayInput::seconds(1.0).with_jitter_ms(200)
  expectedOutput: 1000ms delay with up to 200ms jitter
  passed: true
lessonsLearned:
  whatWorkedWell:
  - Dual representation (value+unit for humans, duration_ms for runtime) keeps both sides clean
  - stateful behaviorTier reflects that Temporal timers survive worker restarts
  challenges:
  - challenge: Mapping f64 value with unit to u64 milliseconds without precision loss
    solution: Round to nearest millisecond in the transformer
    timeSpent: 10 minutes
  recommendations:
  - Use jitter_ms on any delay inside parallel branches to spread load
relatedComponents:
- component: timer
  relationship: Timer is the Temporal-native delay primitive; delay wraps it with ergonomic authoring
- component: loop
  relationship: Delays are commonly placed inside loops for polling patterns
futureImprovements:
- improvement: Cron-expression based delay (delay until next occurrence)
  priority: Low
  effort: Medium
