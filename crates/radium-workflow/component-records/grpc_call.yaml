  fields:
  - name: response
    rustType: Value
    typescriptType: unknown
    required: true
    description: Response message deserialized as JSON
  - name: status_code
    rustType: u32
    typescriptType: number
    required: true
    description: gRPC status code (0 = OK)
  - name: status_message
