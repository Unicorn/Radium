schemaDecisions:
- field: endpoint
  decision: String in host:port format
  rationale: Matches standard gRPC addressing; TLS is opt-in via use_tls
  alternativesConsidered: []
- field: message
  decision: Value (JSON) for the request message
  rationale: Protobuf messages are JSON-serializable; avoids proto codegen dependency
  alternativesConsimented: []
- field: metadata
  decision: HashMap<String, String> for gRPC metadata headers
  rationale: gRPC metadata is key-value pairs, identical in structure to HTTP headers
  alternativesConsidered: []
inputSchema:
  rustStruct: GrpcCallInput
  typescriptInterface: GrpcCallInput
  fields:
  - name: endpoint
    rustType: String
    typescriptType: string
    required: true
    description: gRPC server endpoint in host:port format
  - name: service
    rustType: String
    typescriptType: string
    required: true
    description: Fully-qualified gRPC service name (e.g. package.ServiceName)
  - name: method
    rustType: String
    typescriptType: string
    required: true
    description: RPC method name to invoke
  - name: message
    rustType: Value
    typescriptType: unknown
    required: false
    default: '{}'
    description: Request message as a JSON-serializable object
  - name: metadata
    rustType: HashMap<String, String>
    typescriptType: Record<string, string>
    required: false
    default: '{}'
    description: gRPC metadata key-value pairs sent with the request
  - name: use_tls
    rustType: bool
    typescriptType: boolean
    required: false
    default: 'false'
    description: Whether to use TLS for the connection
  - name: tls_cert_ref
    rustType: Option<String>
    typescriptType: string?
    required: false
    description: Secret store reference for a custom TLS certificate
  - name: deadline_ms
    rustType: Option<u64>
    typescriptType: number?
    required: false
    description: Per-call deadline in milliseconds; overrides component timeout
  - name: timeout_ms
    rustType: u64
    typescriptType: number
    required: false
    default: '30000'
    description: Component-level timeout in milliseconds
  validation: []
