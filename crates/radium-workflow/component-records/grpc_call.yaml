lessonsLearned:
  whatWorkedWell:
  - JSON Value for messages avoids proto codegen complexity
  - deadline_ms separate from timeout_ms mirrors gRPC's own deadline concept
  challenges:
  - challenge: Distinguishing gRPC status codes from HTTP status codes
    solution: Named field status_code with inline documentation
    timeSpent: 10 minutes
  recommendations:
  - Use deadline_ms for per-call control; timeout_ms acts as a ceiling
