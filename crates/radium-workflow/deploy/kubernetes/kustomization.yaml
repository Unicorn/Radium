apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: radium-workflow

namespace: default

labels:
  - pairs:
      app.kubernetes.io/name: radium-workflow
      app.kubernetes.io/component: compiler
      app.kubernetes.io/part-of: radium

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: radium-workflow-env
    behavior: merge
    literals:
      - ENVIRONMENT=production

images:
  - name: radium-workflow
    newName: ghcr.io/your-org/radium-workflow
    newTag: latest
