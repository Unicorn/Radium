apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: radium-workflow
  labels:
    app: radium-workflow
    component: compiler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: radium-workflow
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: radium-workflow
  labels:
    app: radium-workflow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: radium-workflow
