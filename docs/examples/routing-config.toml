# Radium Routing Configuration Example
# This file demonstrates how to configure routing strategies for agent selection.

# ===================================================================
# ROUTING STRATEGY CONFIGURATION (REQ-245 & REQ-246)
# ===================================================================

# Default routing strategy
# Options:
#   - "complexity_based" (legacy): Uses heuristic complexity scoring
#   - "skill_based" (REQ-245): Uses Ai-Agent-Skills framework
#   - "adaptive" (REQ-246): Uses continuous learning with feedback
default_strategy = "skill_based"

# Complexity threshold for complexity-based routing (0-100)
# Tasks with score >= threshold route to Smart tier
threshold = 60.0

# ===================================================================
# SKILL-BASED ROUTING (REQ-245)
# ===================================================================

[skill_routing]
# Enable skill-based routing
enabled = true

# Paths to skill directories or SKILL.md files
# Skills are loaded recursively from these directories
skill_paths = [
    "./skills",              # Default Radium skills
    "./custom-skills",       # Your custom skills
]

# Minimum confidence threshold (0.0-1.0)
# If routing confidence is below this, falls back to keyword matching
confidence_threshold = 0.5

# Enable metrics collection for routing decisions
# Logs routing latency, confidence scores, and outcomes
collect_metrics = true

# ===================================================================
# FALLBACK CHAINS
# ===================================================================

# Define fallback chains for model tier selection
# If a model fails, the next in the chain is tried

[[chains]]
name = "smart"
models = [
    "claude:claude-sonnet-4.5",
    "openai:gpt-4",
    "gemini:gemini-pro",
]

[[chains]]
name = "eco"
models = [
    "claude:claude-haiku-4.5",
    "openai:gpt-3.5-turbo",
]

# ===================================================================
# ROUTING RULES
# ===================================================================

# Conditional routing rules based on complexity scores
# Rules are evaluated in order

[[rules]]
# Simple tasks (complexity 0-40) → Eco tier
complexity_max = 40.0
models = [
    "claude:claude-haiku-4.5",
    "openai:gpt-3.5-turbo",
]

[[rules]]
# Medium tasks (complexity 40-70) → Smart tier
complexity_min = 40.0
complexity_max = 70.0
models = [
    "claude:claude-sonnet-4.5",
    "openai:gpt-4-turbo",
]

[[rules]]
# Complex tasks (complexity 70+) → Premium tier
complexity_min = 70.0
models = [
    "claude:claude-sonnet-4.5",
    "openai:o1",
]

# ===================================================================
# USAGE EXAMPLES
# ===================================================================

# To enable skill-based routing:
# 1. Set skill_routing.enabled = true
# 2. Add your SKILL.md files to the skill_paths directories
# 3. Restart Radium to load the skills
#
# To fall back to complexity-based routing:
# 1. Set default_strategy = "complexity_based"
# 2. Or set skill_routing.enabled = false
#
# To use adaptive routing (REQ-246 - future):
# 1. Set default_strategy = "adaptive"
# 2. Configure feedback collection
# 3. Enable per-project learning

# ===================================================================
# PERFORMANCE BENCHMARKS (REQ-245 Results)
# ===================================================================

# Skill-based routing performance:
#   - Latency: 244 nanoseconds (100x faster than complexity-based)
#   - Throughput: 70.8 million decisions/second
#   - Accuracy: 85-90% (expected)
#   - Memory: ~50MB for 43 skills
#
# Complexity-based routing performance:
#   - Latency: 24.3 microseconds
#   - Throughput: 702K decisions/second
#   - Accuracy: N/A (tier routing only, not agent selection)
