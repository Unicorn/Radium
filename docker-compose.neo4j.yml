# Neo4j for local development of the discovery service
# Usage: docker compose -f docker-compose.neo4j.yml up -d

services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"    # HTTP browser UI
      - "7687:7687"    # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/radium-dev
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "radium-dev", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j-data:
